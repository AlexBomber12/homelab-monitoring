name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python3 -m py_compile homelab_notify.py
      - name: Unit tests (offline)
        run: python3 -m unittest discover -s tests -v
      - name: Verify Ansible deployment syntax
        run: |
          python3 -m pip install --disable-pip-version-check ansible-core==2.19.0
          ansible-playbook -i localhost, --syntax-check deploy/ansible/site.yml
          ansible-playbook -i localhost, --syntax-check deploy/ansible/deactivate.yml
